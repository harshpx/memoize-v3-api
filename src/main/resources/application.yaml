server:
  port: 8080
spring:
  application:
    name: memoize-v3-api
  datasource:
    url: ${JDBC_DB_URL:?JDBC_DB_URL is required}
    username: ${DB_USERNAME:?DB_USERNAME is required}
    password: ${DB_PASSWORD:?DB_PASSWORD is required}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  security:
    oauth2.client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
jwt:
  secret: ${JWT_SECRET?JWT_SECRET is required}